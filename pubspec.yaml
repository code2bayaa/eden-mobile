name: uko_eden
description: >
  Eden — the Garden of New African Cinema, on the phone. Viewers browse Now Screening; studios see
  their monetization, wallet and M-PESA withdrawals; cast & crew sign in with an e-mailed code. Talks
  to the Eden API (eden/back-end, port 5005) through its mobile entry (`x-eden-client: mobile`).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.20.1

  # Not uko_core: that package speaks FastAPI + Bearer partner sessions in UKO navy. Eden is Express,
  # `{status, message, data}` envelopes, two different sign-ins and its own earth/clay palette.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
